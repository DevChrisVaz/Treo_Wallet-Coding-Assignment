# Entorno local de /api: PostgreSQL 16 y Mailpit (servidor SMTP de desarrollo con bandeja web).
# Uso: `docker compose up -d` desde /api. Los roles y bases los crea después `npm run db:bootstrap`.
name: treo-api

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # Superusuario solo para el arranque (db:bootstrap); la API nunca lo usa.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_dev_password}
      POSTGRES_DB: postgres
    ports:
      # 5433 en el host para no chocar con un PostgreSQL local en el 5432.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 2s
      timeout: 3s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_WEB_PORT:-8025}:8025'
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 'true'
      MP_SMTP_AUTH_ALLOW_INSECURE: 'true'
      # Bandeja persistente: sin esto los correos se pierden al recrear el contenedor.
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data

volumes:
  postgres-data:
  mailpit-data:
